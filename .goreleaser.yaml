# goreleaser configuration for natprobe.
#
# Validate a change without cutting a tag:
#
#   goreleaser check                 # config is valid
#   goreleaser release --snapshot --clean   # build everything, publish nothing
#
# Releases are cut by pushing a tag (see .github/workflows/release.yml):
#
#   git tag -a v0.1.0 -m "v0.1.0" && git push origin v0.1.0
version: 2

project_name: natprobe

before:
  hooks:
    - go mod tidy
    - go test ./...

builds:
  - id: natprobe
    main: ./cmd/natprobe
    binary: natprobe
    env:
      # natprobe speaks UDP and HTTP and reads the route table; nothing it
      # does needs cgo, so static binaries keep the archives portable across
      # distros with different libc versions.
      - CGO_ENABLED=0
    flags:
      # -trimpath keeps local absolute paths out of the binary, so builds are
      # reproducible and stack traces do not leak a build machine's layout.
      - -trimpath
    ldflags:
      # -s -w drop the symbol table and DWARF: smaller downloads, and nothing
      # here needs a debugger attached to a released build.
      - -s -w
      - -X github.com/samishal1998/natprobe/internal/cli.Version={{ .Version }}
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      # Windows on ARM is not a platform anyone runs a LAN diagnostic on
      # today; drop it rather than ship an untested archive.
      - goos: windows
        goarch: arm64

archives:
  - id: natprobe
    # The installer parses these names, so the format is a contract:
    #   natprobe_<version>_<os>_<arch>.tar.gz   (linux, darwin)
    #   natprobe_<version>_<os>_<arch>.zip      (windows)
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - README.md
      - LICENSE*

checksum:
  # `sha256sum -c checksums.txt` works verbatim after downloading, which is
  # what install.sh uses to verify what it fetched.
  name_template: checksums.txt
  algorithm: sha256

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  use: github
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - "^ci:"
      - Merge pull request
      - Merge branch

release:
  draft: false
  prerelease: auto
  header: |
    ## natprobe {{ .Tag }}

    `dig` for NAT traversal: probes the LAN gateway for UPnP IGD, PCP and
    NAT-PMP support, shows wire-level detail, and explains failures in plain
    language.
  footer: |
    ## Install

    macOS / Linux:

    ```sh
    curl -fsSL https://raw.githubusercontent.com/samishal1998/natprobe/main/install.sh | sh
    ```

    Or with Go:

    ```sh
    go install github.com/samishal1998/natprobe/cmd/natprobe@{{ .Tag }}
    ```

    Verify a download with `sha256sum -c checksums.txt`.
